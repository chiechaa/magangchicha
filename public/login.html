<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Hotspot Gateway - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b0f19;
            --bg-card: #131b2e;
            --border-tech: #1e293b;
            --cyan: #06b6d4;
            --cyan-glow: rgba(6, 182, 212, 0.4);
            --emerald: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
                linear-gradient(rgba(30, 41, 59, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 41, 59, 0.15) 1px, transparent 1px);
            background-size: auto, auto, 24px 24px, 24px 24px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 36px 32px 30px;
            border-radius: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-tech);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(6, 182, 212, 0.1);
        }

        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-tech);
        }
        .terminal-dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: var(--rose); }
        .dot-yellow { background: var(--amber); }
        .dot-green { background: var(--cyan); }
        .terminal-title {
            margin-left: auto;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .header { text-align: center; margin-bottom: 26px; }

        .racing-icon {
            width: 64px; height: 64px;
            margin: 0 auto 14px;
            display: flex; justify-content: center; align-items: center;
            font-size: 26px;
            border-radius: 12px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid var(--cyan);
            box-shadow: 0 0 15px var(--cyan-glow);
        }

        .header h1 {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 32px;
            line-height: 1.1;
            letter-spacing: 0.05em;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .header p {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 4px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--emerald);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: #090d16;
            border: 1px solid var(--border-tech);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }
        .form-group input::placeholder { color: #475569; }
        .form-group input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px var(--cyan-glow);
        }

        .btn {
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--cyan), #0284c7);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
            transition: all 0.2s ease;
        }
        .btn:hover { filter: brightness(1.1); box-shadow: 0 6px 16px rgba(6, 182, 212, 0.5); }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { background: #334155; color: #64748b; box-shadow: none; cursor: not-allowed; }

        .message {
            padding: 12px 14px;
            border-radius: 8px;
            margin-top: 16px;
            display: none;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }
        .message.success { background: rgba(16, 185, 129, 0.15); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
        .message.error { background: rgba(244, 63, 94, 0.15); color: var(--rose); border: 1px solid rgba(244, 63, 94, 0.3); }
        .message.info { background: rgba(6, 182, 212, 0.15); color: var(--cyan); border: 1px solid rgba(6, 182, 212, 0.3); }

        .register-link { text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 12px; }
        .register-link a { color: var(--cyan); font-weight: 700; text-decoration: none; }
        .register-link a:hover { text-decoration: underline; }

        .loading {
            display: inline-block; width: 12px; height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; border-top-color: #fff;
            animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status-check {
            margin-top: 16px; padding: 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px dashed var(--border-tech);
            border-radius: 8px;
            display: none;
        }
        .status-check.show { display: block; }
        .status-check input {
            width: calc(100% - 64px); padding: 9px 12px;
            background: #090d16; border: 1px solid var(--border-tech); border-radius: 6px;
            color: var(--text-main); margin-right: 6px; outline: none;
            font-size: 12px; font-family: 'JetBrains Mono', monospace;
        }
        .status-check input:focus { border-color: var(--cyan); }
        .status-check button {
            padding: 9px 14px; background: var(--border-tech); color: var(--text-main);
            border: 1px solid #475569; border-radius: 6px; cursor: pointer;
            font-weight: 700; font-size: 12px; font-family: 'JetBrains Mono', monospace;
            transition: all 0.2s;
        }
        .status-check button:hover { background: var(--cyan); color: #000; border-color: var(--cyan); }

        .status-result { margin-top: 10px; padding: 10px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; display: none; }
        .status-result.approved { background: rgba(16, 185, 129, 0.15); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-result.pending { background: rgba(245, 158, 11, 0.15); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-result.rejected { background: rgba(244, 63, 94, 0.15); color: var(--rose); border: 1px solid rgba(244, 63, 94, 0.3); }
        .status-result.not-found { background: rgba(148, 163, 184, 0.15); color: var(--text-muted); border: 1px solid var(--border-tech); }

        .toggle-status {
            background: none; border: none; color: var(--text-muted); cursor: pointer;
            font-size: 11px; font-weight: 700; font-family: 'JetBrains Mono', monospace;
            text-decoration: underline; letter-spacing: 0.05em;
        }
        .toggle-status:hover { color: var(--cyan); }

        .btn:focus-visible, .toggle-status:focus-visible, .status-check button:focus-visible {
            outline: 2px solid var(--cyan); outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Bar atas terminal -->
        <div class="terminal-bar">
            <div class="terminal-dot dot-red"></div>
            <div class="terminal-dot dot-yellow"></div>
            <div class="terminal-dot dot-green"></div>
            <div class="terminal-title">gateway://auth-session</div>
        </div>

        <div class="header">
            <div class="racing-icon">⚡</div>
            <h1>Network Gateway</h1>
            <p>Secure Hotspot Auth</p>
        </div>

        <!-- FORM LOGIN MIKROTIK NATIVE ACTION -->
        <form id="loginForm" name="login" action="$(link-login-only)" method="post">
            <input type="hidden" name="dst" value="$(link-orig)">
            <input type="hidden" name="popup" value="true">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="" required placeholder="Masukkan username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Connect</span>
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="status-check" id="statusCheck">
            <p style="margin-bottom: 8px; color: var(--text-muted); font-size: 11px; font-weight: 700; text-transform: uppercase;">Cek Status Akses:</p>
            <div style="display: flex;">
                <input type="text" id="checkUsername" placeholder="Username...">
                <button type="button" onclick="checkStatus()">Cek</button>
            </div>
            <div class="status-result" id="statusResult"></div>
        </div>

        <div class="register-link">
            Belum punya akses? <a href="register.html">Registrasi di sini</a>
        </div>

        <div style="text-align: center; margin-top: 14px;">
            <button type="button" class="toggle-status" onclick="toggleStatusCheck()">
                [ Cek Status Registrasi ]
            </button>
        </div>
    </div>

    <script>
        // Menggunakan domain Vercel aktif yang terhubung ke database Upstash
        const BACKEND_URL = 'https://mamat-git-main-ahmad5-388c.vercel.app';

        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');
        const statusCheck = document.getElementById('statusCheck');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            const formData = {
                username: usernameVal,
                password: passwordVal
            };

            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Verifying...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`Akses diizinkan, Driver ${data.user.name}! Login berhasil.`, 'success');

                    setTimeout(() => {
                        showMessage('Menghubungkan ke jaringan...', 'info');
                        HTMLFormElement.prototype.submit.call(form);
                    }, 1500);
                } else {
                    showMessage(data.message, 'error');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Connect';
                }
            } catch (error) {
                console.error(error);
                showMessage('Terjadi kesalahan koneksi ke server backend.', 'error');
                submitBtn.disabled = false;
                btnText.textContent = 'Connect';
            }
        });

        function toggleStatusCheck() {
            statusCheck.classList.toggle('show');
        }

        async function checkStatus() {
            const username = document.getElementById('checkUsername').value;
            const statusResult = document.getElementById('statusResult');

            if (!username) {
                statusResult.textContent = 'Masukkan username terlebih dahulu';
                statusResult.className = 'status-result not-found';
                statusResult.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/status/${username}`);
                const data = await response.json();

                if (data.success) {
                    statusResult.textContent = `Status: ${data.status.toUpperCase()}`;
                    statusResult.className = `status-result ${data.status}`;
                    statusResult.style.display = 'block';

                    if (data.status === 'pending') {
                        statusResult.textContent += ' - Menunggu persetujuan Admin';
                    } else if (data.status === 'approved') {
                        statusResult.textContent += ' - Siap terhubung';
                    } else if (data.status === 'rejected') {
                        statusResult.textContent += ' - Akses ditolak';
                    }
                } else {
                    statusResult.textContent = data.message;
                    statusResult.className = 'status-result not-found';
                    statusResult.style.display = 'block';
                }
            } catch (error) {
                statusResult.textContent = 'Gagal mengecek status (Server backend tidak aktif)';
                statusResult.className = 'status-result not-found';
                statusResult.style.display = 'block';
            }
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }
    </script>
</body>
</html>
