<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="/">
    <title>Network Registration - Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0b0f19;
            --bg-card: #131b2e;
            --border-tech: #1e293b;
            --cyan: #06b6d4;
            --cyan-glow: rgba(6, 182, 212, 0.4);
            --emerald: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 28px 20px;
            color: var(--text-main);
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(6, 182, 212, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.06) 0%, transparent 40%),
                linear-gradient(rgba(30, 41, 59, 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 41, 59, 0.15) 1px, transparent 1px);
            background-size: auto, auto, 24px 24px, 24px 24px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 440px;
            padding: 36px 32px 30px;
            border-radius: 16px;
            background: var(--bg-card);
            border: 1px solid var(--border-tech);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(6, 182, 212, 0.1);
        }

        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-tech);
        }
        .terminal-dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: var(--rose); }
        .dot-yellow { background: var(--amber); }
        .dot-green { background: var(--cyan); }
        .terminal-title {
            margin-left: auto;
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .header { text-align: center; margin-bottom: 24px; }

        .header h1 {
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 32px;
            line-height: 1.1;
            letter-spacing: 0.05em;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .header p {
            display: inline-block;
            padding: 3px 12px;
            border-radius: 4px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: var(--cyan);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .form-group { margin-bottom: 14px; }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group input {
            width: 100%;
            padding: 11px 16px;
            background: #090d16;
            border: 1px solid var(--border-tech);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
        }
        .form-group input::placeholder { color: #475569; }
        .form-group input:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px var(--cyan-glow);
        }

        .btn {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--cyan), #0284c7);
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
            transition: all 0.2s ease;
        }
        .btn:hover { filter: brightness(1.1); box-shadow: 0 6px 16px rgba(6, 182, 212, 0.5); }
        .btn:active { transform: translateY(1px); }
        .btn:disabled { background: #334155; color: #64748b; box-shadow: none; cursor: not-allowed; }
        .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

        .message {
            padding: 12px 14px;
            border-radius: 8px;
            margin-top: 16px;
            display: none;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
        }
        .message.success { background: rgba(16, 185, 129, 0.15); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
        .message.error { background: rgba(244, 63, 94, 0.15); color: var(--rose); border: 1px solid rgba(244, 63, 94, 0.3); }

        .login-link { text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 12px; }
        .login-link a { color: var(--cyan); font-weight: 700; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }

        .loading {
            display: inline-block; width: 12px; height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
            border-top-color: #fff; animation: spin 0.8s linear infinite;
            margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <!-- Bar atas terminal -->
        <div class="terminal-bar">
            <div class="terminal-dot dot-red"></div>
            <div class="terminal-dot dot-yellow"></div>
            <div class="terminal-dot dot-green"></div>
            <div class="terminal-title">gateway://user-register</div>
        </div>

        <div class="header">
            <h1>Registrasi Akun</h1>
            <p>New Access Node</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="name">Nama Lengkap</label>
                <input type="text" id="name" required placeholder="Masukkan nama lengkap">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="Masukkan email">
            </div>
            <div class="form-group">
                <label for="phone">Nomor Telepon</label>
                <input type="tel" id="phone" required placeholder="Masukkan nomor telepon">
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Masukkan password">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Konfirmasi Password</label>
                <input type="password" id="confirmPassword" required placeholder="Konfirmasi password">
            </div>
            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">Daftar Sekarang</span>
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="login-link">
            Sudah punya akun? <a href="login.html">Login di sini</a>
        </div>
    </div>

    <script>
        // Mengunci langsung ke domain production Vercel yang stabil
        const BACKEND_URL = 'https://mamat-cyan.vercel.app';

        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                showMessage('Password tidak cocok!', 'error');
                return;
            }

            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Memproses...';
            message.style.display = 'none';

            try {
                const response = await fetch(`${BACKEND_URL}/api/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, phone, username, password })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    showMessage('Registrasi berhasil! Menunggu persetujuan admin.', 'success');
                    form.reset();
                    setTimeout(() => {
                        window.location.href = '/login.html?registered=success';
                    }, 2500);
                } else {
                    showMessage(result.message || 'Registrasi gagal.', 'error');
                    submitBtn.disabled = false;
                    btnText.textContent = 'Daftar Sekarang';
                }
            } catch (err) {
                console.error(err);
                showMessage('Terjadi kesalahan jaringan.', 'error');
                submitBtn.disabled = false;
                btnText.textContent = 'Daftar Sekarang';
            }
        });

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }
    </script>
</body>
</html>
