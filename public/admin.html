<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bratz Hotspot Gateway - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #090d16;
            --bg-panel: #111827;
            --border-tech: #1e293b;
            --accent-cyan: #00f0ff;
            --accent-emerald: #10b981;
            --accent-amber: #f59e0b;
            --accent-rose: #f43f5e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            min-height: 100vh;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 32px 32px;
            background-attachment: fixed;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }

        /* Header Cyber Styling */
        .brand {
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 26px;
            letter-spacing: 0.05em;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
        }
        .tagline {
            display: inline-block;
            margin-top: 6px;
            padding: 2px 10px;
            border-radius: 4px;
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid rgba(0, 240, 255, 0.3);
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .head-line { border-bottom: 1px solid var(--border-tech); }

        .btn-refresh {
            padding: 8px 18px;
            border: 1px solid rgba(0, 240, 255, 0.4);
            border-radius: 6px;
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.15) 0%, rgba(0, 240, 255, 0.05) 100%);
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
            transition: all 0.2s ease;
        }
        .btn-refresh:hover { 
            background: rgba(0, 240, 255, 0.25);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3);
            border-color: var(--accent-cyan);
        }
        .btn-refresh:active { transform: translateY(1px); }

        /* Metric cards - Tactical Display */
        .metric {
            padding: 20px;
            border-radius: 10px;
            background: var(--bg-panel);
            border: 1px solid var(--border-tech);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }
        .metric::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 3px; height: 100%;
        }
        .metric.total::before { background: var(--accent-cyan); }
        .metric.pending::before { background: var(--accent-amber); }
        .metric.approved::before { background: var(--accent-emerald); }
        .metric.rejected::before { background: var(--accent-rose); }

        .metric .label { 
            font-size: 12px; 
            font-weight: 600; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 0.1em;
            font-family: 'JetBrains Mono', monospace;
        }
        .metric .num {
            margin-top: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 38px;
            font-weight: 800;
            line-height: 1;
        }
        .metric.total .num { color: #fff; text-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
        .metric.pending .num { color: var(--accent-amber); text-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
        .metric.approved .num { color: var(--accent-emerald); text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }
        .metric.rejected .num { color: var(--accent-rose); text-shadow: 0 0 10px rgba(244, 63, 94, 0.3); }

        /* Table panel */
        .panel {
            position: relative;
            padding: 24px;
            border-radius: 12px;
            background: var(--bg-panel);
            border: 1px solid var(--border-tech);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .spots {
            display: none; /* Replaced with subtle tech badge */
        }
        .panel h2 {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 0.05em;
            color: #fff;
            text-transform: uppercase;
        }
        .panel h2::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            box-shadow: 0 0 8px var(--accent-cyan);
        }
        thead tr { border-bottom: 1px solid var(--border-tech) !important; }
        thead th { color: var(--text-muted) !important; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; font-family: 'JetBrains Mono', monospace; }

        /* Row styling and status indicators */
        #userTableBody { font-size: 13px; }
        .row { border-bottom: 1px solid rgba(30, 41, 59, 0.6); transition: background 0.15s ease; }
        .row:hover { background: rgba(0, 240, 255, 0.03); }
        .cell-name { color: #fff; font-weight: 600; font-size: 14px; }
        .cell-user { color: var(--accent-cyan); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
        .cell-contact { color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
        .cell-date { color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 11px; }
        .msg-empty { color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
        .msg-error { color: var(--accent-rose); font-weight: 700; font-family: 'JetBrains Mono', monospace; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 4px;
            border: 1px solid;
            font-size: 11px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: 0.05em;
        }
        .badge-ok   { background: rgba(16, 185, 129, 0.1); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
        .badge-no   { background: rgba(244, 63, 94, 0.1); color: #fb7185; border-color: rgba(244, 63, 94, 0.3); }
        .badge-wait { background: rgba(245, 158, 11, 0.1); color: #fbbf24; border-color: rgba(245, 158, 11, 0.3); }

        .act {
            padding: 5px 12px;
            border: 1px solid;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .act:hover { filter: brightness(1.2); }
        .act:active { transform: translateY(1px); }
        .act-approve { background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.4); }
        .act-reject  { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: rgba(245, 158, 11, 0.4); }
        .act-drop    { background: rgba(244, 63, 94, 0.15); color: #fb7185; border-color: rgba(244, 63, 94, 0.4); }
        .act-drop:hover { background: rgba(244, 63, 94, 0.3); }

        .btn-refresh:focus-visible, .act:focus-visible { outline: 1px solid var(--accent-cyan); outline-offset: 2px; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-7xl mx-auto space-y-6">

        <!-- Header -->
        <div class="flex justify-between items-center head-line pb-5">
            <div>
                <h1 class="brand flex items-center gap-3">
                    <span class="w-2.5 h-2.5 rounded-full animate-pulse" style="background: var(--accent-cyan); box-shadow: 0 0 10px var(--accent-cyan);"></span>
                    GATEWAY // ADMIN.SYS
                </h1>
                <p class="tagline">INTERFACE: wlan1-hotspot [ SECURE_CORE ]</p>
            </div>
            <button onclick="loadUsers()" class="btn-refresh flex items-center gap-2">
                <span>[⚡]</span> REFRESH DATA
            </button>
        </div>

        <!-- Metric Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="metric total">
                <div class="label">Total Registrations</div>
                <div class="num" id="totalCount">0</div>
            </div>
            <div class="metric pending">
                <div class="label">Pending Approval</div>
                <div class="num" id="pendingCount">0</div>
            </div>
            <div class="metric approved">
                <div class="label">Approved / Active</div>
                <div class="num" id="approvedCount">0</div>
            </div>
            <div class="metric rejected">
                <div class="label">Blocked / Rejected</div>
                <div class="num" id="rejectedCount">0</div>
            </div>
        </div>

        <!-- Table Section -->
        <div class="panel">
            <div class="spots"></div>
            <h2>Subscriber Active Session Table</h2>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs text-slate-400 mono">
                            <th class="p-3">USER & CREDENTIALS</th>
                            <th class="p-3">CONTACT</th>
                            <th class="p-3">STATUS</th>
                            <th class="p-3">DATE REGISTERED</th>
                            <th class="p-3 text-right">ACTIONS</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="text-xs mono">
                        <tr>
                            <td colspan="5" class="p-6 text-center msg-empty">Memuat data dari Upstash Redis...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadUsers() {
            const tableBody = document.getElementById('userTableBody');
            try {
                const response = await fetch('/api/users');
                const data = await response.json();

                if (!data.success || !data.users) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center msg-error">Gagal mengambil data pengguna.</td></tr>`;
                    return;
                }

                const users = data.users;

                // Update Counter
                document.getElementById('totalCount').textContent = users.length;
                document.getElementById('pendingCount').textContent = users.filter(u => u.status === 'pending').length;
                document.getElementById('approvedCount').textContent = users.filter(u => u.status === 'approved').length;
                document.getElementById('rejectedCount').textContent = users.filter(u => u.status === 'rejected').length;

                if (users.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center msg-empty">Belum ada user mendaftar.</td></tr>`;
                    return;
                }

                // Render Data Table
                tableBody.innerHTML = users.map(user => {
                    let statusBadge = '';
                    if (user.status === 'approved') {
                        statusBadge = `<span class="badge badge-ok">● ACTIVE</span>`;
                    } else if (user.status === 'rejected') {
                        statusBadge = `<span class="badge badge-no">■ BLOCKED</span>`;
                    } else {
                        statusBadge = `<span class="badge badge-wait">▲ PENDING</span>`;
                    }

                    const dateStr = user.createdAt ? new Date(user.createdAt).toLocaleString('id-ID') : '-';

                    return `
                        <tr class="row">
                            <td class="p-3.5">
                                <div class="cell-name">${user.name || '-'}</div>
                                <div class="cell-user">USR: ${user.username}</div>
                            </td>
                            <td class="p-3.5 cell-contact">
                                <div>${user.email || '-'}</div>
                                <div>${user.phone || '-'}</div>
                            </td>
                            <td class="p-3.5">${statusBadge}</td>
                            <td class="p-3.5 cell-date">${dateStr}</td>
                            <td class="p-3.5 text-right space-x-2">
                                ${user.status === 'pending' ? `
                                    <button onclick="approveUser('${user.username}')" class="act act-approve">APPROVE</button>
                                    <button onclick="rejectUser('${user.username}')" class="act act-reject">REJECT</button>
                                ` : ''}
                                <button onclick="deleteUser('${user.username}')" class="act act-drop">DROP</button>
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error(err);
                tableBody.innerHTML = `<tr><td colspan="5" class="p-6 text-center msg-error">Terjadi kesalahan koneksi ke API.</td></tr>`;
            }
        }

        async function approveUser(username) {
            if (!confirm(`Setujui pendaftaran ${username}?`)) return;
            try {
                const res = await fetch('/api/approve', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, adminName: 'Admin' })
                });
                const result = await res.json();
                alert(result.message);
                loadUsers();
            } catch (e) {
                alert('Gagal menyetujui user');
            }
        }

        async function rejectUser(username) {
            if (!confirm(`Tolak pendaftaran ${username}?`)) return;
            try {
                const res = await fetch('/api/reject', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, adminName: 'Admin' })
                });
                const result = await res.json();
                alert(result.message);
                loadUsers();
            } catch (e) {
                alert('Gagal menolak user');
            }
        }

        async function deleteUser(username) {
            if (!confirm(`Hapus permanen user ${username}?`)) return;
            try {
                const res = await fetch(`/api/users/${username}`, { method: 'DELETE' });
                const result = await res.json();
                alert(result.message);
                loadUsers();
            } catch (e) {
                alert('Gagal menghapus user');
            }
        }

        // Jalankan saat halaman selesai dimuat
        document.addEventListener('DOMContentLoaded', loadUsers);
    </script>
</body>
</html>
