<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotspot Login - Bratz Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff1493;
            --hot: #ff4fb8;
            --candy: #ffd1ec;
            --purple: #5b1a8f;
            --deep: #2a0a45;
            --gold: #ffd24a;
            --cyan: #36e0ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
            font-family: 'Quicksand', sans-serif;
            background-color: var(--deep);
            background-image:
                radial-gradient(circle at 20% 15%, rgba(255, 20, 147, 0.55), transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(54, 224, 255, 0.3), transparent 45%),
                radial-gradient(rgba(255, 255, 255, 0.35) 1.2px, transparent 1.6px),
                radial-gradient(rgba(255, 210, 74, 0.35) 1px, transparent 1.4px);
            background-size: auto, auto, 34px 34px, 52px 52px;
            background-position: 0 0, 0 0, 0 0, 17px 21px;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            padding: 34px 32px 30px;
            border-radius: 28px;
            background: linear-gradient(160deg, #7a1fb8 0%, #4a1280 100%);
            border: 3px solid var(--hot);
            box-shadow:
                0 0 0 6px rgba(255, 20, 147, 0.25),
                0 25px 50px rgba(0, 0, 0, 0.55),
                0 0 45px rgba(255, 20, 147, 0.45);
        }

        /* Strip motif leopard di atas kartu */
        .spots {
            position: absolute;
            top: 0; left: 18px; right: 18px;
            height: 14px;
            transform: translateY(-50%);
            border-radius: 999px;
            background:
                radial-gradient(ellipse 7px 5px at 12px 7px, #1a0630 55%, transparent 60%) 0 0 / 34px 14px repeat-x,
                var(--gold);
            border: 2px solid var(--deep);
        }

        .terminal-bar {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 20px;
        }
        .terminal-dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
        .dot-red { background: var(--pink); }
        .dot-yellow { background: var(--gold); }
        .dot-green { background: var(--cyan); }
        .terminal-title {
            margin-left: auto;
            font-size: 12px;
            font-weight: 700;
            color: var(--candy);
        }

        .header { text-align: center; margin-bottom: 26px; }

        .racing-icon {
            width: 72px; height: 72px;
            margin: 0 auto 12px;
            display: flex; justify-content: center; align-items: center;
            font-size: 34px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--gold), #ff9ad5);
            border: 3px solid #fff;
            box-shadow: 0 0 0 4px var(--pink), 0 8px 20px rgba(255, 20, 147, 0.6);
            transform: rotate(-8deg);
        }

        .header h1 {
            font-family: 'Lilita One', sans-serif;
            font-weight: 400;
            font-size: 44px;
            line-height: 1;
            letter-spacing: 0.02em;
            color: #fff;
            -webkit-text-stroke: 2px var(--deep);
            paint-order: stroke fill;
            text-shadow: 3px 3px 0 var(--pink), 6px 6px 0 var(--deep);
            transform: rotate(-2deg);
            margin-bottom: 14px;
        }

        .header p {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 999px;
            background: var(--gold);
            color: var(--deep);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            padding-left: 6px;
            color: var(--candy);
            font-size: 14px;
            font-weight: 700;
        }

        .form-group input {
            width: 100%;
            padding: 13px 18px;
            background: #fff0f9;
            border: 2px solid var(--hot);
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Quicksand', sans-serif;
            color: var(--deep);
            outline: none;
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        .form-group input::placeholder { color: #b07ac9; font-weight: 500; }
        .form-group input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(255, 210, 74, 0.5), 0 0 18px rgba(255, 79, 184, 0.7);
        }

        .btn {
            width: 100%;
            margin-top: 6px;
            padding: 14px;
            border: 3px solid #fff;
            border-radius: 999px;
            background: linear-gradient(180deg, #ff6ec7 0%, var(--pink) 55%, #d10a78 100%);
            color: #fff;
            font-family: 'Lilita One', sans-serif;
            font-size: 22px;
            letter-spacing: 0.08em;
            text-shadow: 0 2px 0 rgba(42, 10, 69, 0.6);
            cursor: pointer;
            box-shadow: 0 6px 0 var(--deep), 0 10px 22px rgba(255, 20, 147, 0.55);
            transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.2s ease;
        }
        .btn:hover { filter: brightness(1.08); }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--deep), 0 4px 12px rgba(255, 20, 147, 0.5); }
        .btn:disabled { background: #8a6aa6; border-color: #c9b3dc; color: #e6d8f0; text-shadow: none; box-shadow: 0 4px 0 var(--deep); cursor: not-allowed; }

        .message {
            padding: 12px 16px;
            border-radius: 18px;
            margin-top: 16px;
            display: none;
            font-size: 13px;
            font-weight: 700;
            text-align: center;
        }
        .message.success { background: #d9fff0; color: #0a6b45; border: 2px solid #2fd69a; }
        .message.error { background: #ffe0ec; color: #a10a47; border: 2px solid var(--pink); }
        .message.info { background: #e3f8ff; color: #0a5f7a; border: 2px solid var(--cyan); }

        .register-link { text-align: center; margin-top: 22px; color: var(--candy); font-size: 14px; font-weight: 600; }
        .register-link a { color: var(--gold); font-weight: 700; text-decoration: none; border-bottom: 2px dashed var(--gold); }
        .register-link a:hover { color: #fff; border-color: #fff; }

        .loading {
            display: inline-block; width: 14px; height: 14px;
            border: 3px solid rgba(255, 255, 255, 0.4); border-radius: 50%; border-top-color: #fff;
            animation: spin 0.8s linear infinite; margin-right: 8px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .status-check {
            margin-top: 16px; padding: 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed var(--hot);
            border-radius: 20px;
            display: none;
        }
        .status-check.show { display: block; }
        .status-check input {
            width: calc(100% - 64px); padding: 10px 14px;
            background: #fff0f9; border: 2px solid var(--hot); border-radius: 999px;
            color: var(--deep); margin-right: 6px; outline: none;
            font-size: 13px; font-weight: 600; font-family: 'Quicksand', sans-serif;
        }
        .status-check input:focus { border-color: var(--gold); }
        .status-check button {
            padding: 10px 16px; background: var(--gold); color: var(--deep);
            border: 2px solid #fff; border-radius: 999px; cursor: pointer;
            font-weight: 700; font-size: 13px; font-family: 'Quicksand', sans-serif;
            transition: transform 0.1s ease;
        }
        .status-check button:hover { transform: scale(1.05); }

        .status-result { margin-top: 10px; padding: 10px 14px; border-radius: 16px; font-size: 12px; font-weight: 700; display: none; }
        .status-result.approved { background: #d9fff0; color: #0a6b45; border: 2px solid #2fd69a; }
        .status-result.pending { background: #fff3cf; color: #8a5a00; border: 2px solid var(--gold); }
        .status-result.rejected { background: #ffe0ec; color: #a10a47; border: 2px solid var(--pink); }
        .status-result.not-found { background: #efe5f7; color: #5b1a8f; border: 2px solid #b07ac9; }

        .toggle-status {
            background: none; border: none; color: var(--candy); cursor: pointer;
            font-size: 13px; font-weight: 700; font-family: 'Quicksand', sans-serif;
            text-decoration: underline wavy var(--hot); text-underline-offset: 4px;
        }
        .toggle-status:hover { color: #fff; }

        .btn:focus-visible, .toggle-status:focus-visible, .status-check button:focus-visible {
            outline: 3px solid var(--gold); outline-offset: 3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spots"></div>

        <!-- Bar atas -->
        <div class="terminal-bar">
            <div class="terminal-dot dot-red"></div>
            <div class="terminal-dot dot-yellow"></div>
            <div class="terminal-dot dot-green"></div>
            <div class="terminal-title">💋 hotspot-auth</div>
        </div>

        <div class="header">
            <div class="racing-icon">💄</div>
            <h1>Bratz Hotspot</h1>
            <p>✨ Passion for WiFi ✨</p>
        </div>

        <!-- FORM LOGIN MIKROTIK NATIVE ACTION -->
        <form id="loginForm" name="login" action="$(link-login-only)" method="post">
            <input type="hidden" name="dst" value="$(link-orig)">
            <input type="hidden" name="popup" value="true">

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" value="" required placeholder="Masukkan username driver">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Masukkan password">
            </div>

            <button type="submit" class="btn" id="submitBtn">
                <span id="btnText">MASUK</span>
            </button>
        </form>

        <div class="message" id="message"></div>

        <div class="status-check" id="statusCheck">
            <p style="margin-bottom: 8px; color: #ffd1ec; font-size: 13px; font-weight: 700;">Cek Telemetri Registrasi:</p>
            <div style="display: flex;">
                <input type="text" id="checkUsername" placeholder="Username Driver">
                <button type="button" onclick="checkStatus()">Cek</button>
            </div>
            <div class="status-result" id="statusResult"></div>
        </div>

        <div class="register-link">
            Belum punya akun? <a href="register.html">Registrasi</a>
        </div>

        <div style="text-align: center; margin-top: 16px;">
            <button type="button" class="toggle-status" onclick="toggleStatusCheck()">
                Cek status registrasi
            </button>
        </div>
    </div>

    <script>
        // Menggunakan domain Vercel aktif yang terhubung ke database Upstash
        const BACKEND_URL = 'https://mamat-git-main-ahmad5-388c.vercel.app';

        const form = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const message = document.getElementById('message');
        const statusCheck = document.getElementById('statusCheck');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            const formData = {
                username: usernameVal,
                password: passwordVal
            };

            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loading"></span> Connecting Telemetry...';

            try {
                const response = await fetch(`${BACKEND_URL}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    showMessage(`System initialized, Driver ${data.user.name}! Login berhasil.`, 'success');

                    setTimeout(() => {
                        showMessage('Masuk ke jalur utama...', 'info');
                        HTMLFormElement.prototype.submit.call(form);
                    }, 1500);
                } else {
                    showMessage(data.message, 'error');
                    submitBtn.disabled = false;
                    btnText.textContent = 'MASUK';
                }
            } catch (error) {
                console.error(error);
                showMessage('Terjadi kesalahan koneksi ke server backend.', 'error');
                submitBtn.disabled = false;
                btnText.textContent = 'MASUK';
            }
        });

        function toggleStatusCheck() {
            statusCheck.classList.toggle('show');
        }

        async function checkStatus() {
            const username = document.getElementById('checkUsername').value;
            const statusResult = document.getElementById('statusResult');

            if (!username) {
                statusResult.textContent = 'Masukkan username driver terlebih dahulu';
                statusResult.className = 'status-result not-found';
                statusResult.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/status/${username}`);
                const data = await response.json();

                if (data.success) {
                    statusResult.textContent = `Status: ${data.status.toUpperCase()}`;
                    statusResult.className = `status-result ${data.status}`;
                    statusResult.style.display = 'block';

                    if (data.status === 'pending') {
                        statusResult.textContent += ' - Menunggu akses dari System (Admin)';
                    } else if (data.status === 'approved') {
                        statusResult.textContent += ' - Siap terhubung ke jaringan';
                    } else if (data.status === 'rejected') {
                        statusResult.textContent += ' - Akses ditolak';
                    }
                } else {
                    statusResult.textContent = data.message;
                    statusResult.className = 'status-result not-found';
                    statusResult.style.display = 'block';
                }
            } catch (error) {
                statusResult.textContent = 'Gagal mengecek status (Server backend tidak aktif)';
                statusResult.className = 'status-result not-found';
                statusResult.style.display = 'block';
            }
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = `message ${type}`;
            message.style.display = 'block';
        }
    </script>
</body>
</html>
